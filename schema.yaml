components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        user_email:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - company
      - created_at
      - details
      - id
      - ip_address
      - resource_id
      - resource_type
      - user_email
    CashRegister:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        store:
          type: string
          format: uuid
        store_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/CashRegisterStatusEnum'
          readOnly: true
        current_cashier:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        cashier_name:
          type: string
          readOnly: true
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        current_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cashier_name
      - code
      - company
      - created_at
      - current_balance
      - current_cashier
      - id
      - name
      - status
      - store
      - store_name
    CashRegisterRequest:
      type: object
      properties:
        store:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 50
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - code
      - name
      - store
    CashRegisterStatusEnum:
      enum:
      - CLOSED
      - OPEN
      type: string
      description: |-
        * `CLOSED` - Fermée
        * `OPEN` - Ouverte
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - id
      - name
      - slug
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
      required:
      - name
      - slug
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        registration_number:
          type: string
          maxLength: 100
        tax_identifier:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        currency:
          type: string
          maxLength: 10
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
