version: '3.8'

services:
  # Database PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora_db}
      POSTGRES_USER: ${DB_USER:-nexora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexora_secret}
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexora} -d ${DB_NAME:-nexora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Broker Redis
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - nexora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django REST Framework
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-nexora-prod-secret-change-me-12345}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DB_ENGINE=postgresql
      - DB_NAME=${DB_NAME:-nexora_db}
      - DB_USER=${DB_USER:-nexora}
      - DB_PASSWORD=${DB_PASSWORD:-nexora_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./backups:/app/backups

  # Frontend Next.js 14
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  nexora_pgdata:
  nexora_redisdata:
